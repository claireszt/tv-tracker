services:
  dev-db:
    image: postgres:14
    restart: always
    container_name: dev-db
    environment:
      POSTGRES_USER: dev_claire
      POSTGRES_PASSWORD: ak1h6IjcBtY^
      POSTGRES_DB: tvtracker_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # ✅ Persistent storage

  tv-tracker-app:
    build: .
    container_name: tv-tracker-app
    depends_on:
      - dev-db
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL} # ✅ Uses environment variables
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma generate &&
             npx prisma migrate deploy &&
             npm run dev"  # ✅ Ensures DB migrations run before Next.js starts

volumes:
  pgdata:
