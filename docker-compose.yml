services:
  dev-db:
    image: postgres:14
    restart: always
    container_name: dev-db
    environment:
      POSTGRES_USER: dev_user # ✅ Matches DATABASE_URL
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # ✅ Persistent storage

  tv-tracker-app:
    build: .
    container_name: tv-tracker-app
    depends_on:
      - dev-db
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://dev_user:dev_password@dev-db:5432/dev_db" # ✅ Matches PostgreSQL credentials
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run dev"  # ✅ Ensures DB migrations run before starting Next.js

volumes:
  pgdata:
